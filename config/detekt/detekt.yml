# Default:
# https://github.com/detekt/detekt/blob/main/detekt-core/src/main/resources/default-detekt-config.yml

config:
  warningsAsErrors: true

coroutines:
  # https://github.com/detekt/detekt/issues/8997
  RedundantSuspendModifier:
    active: false

complexity:
  TooManyFunctions:
    # ValueClassConversionContract holds a large, deliberately flat set of value-class scenarios
    # as a shared contract test.
    excludes: [ '**/src/test/**', '**/src/functionalTest/**', '**/kuery-client-spring-data-testing/**/ValueClassConversionContract.kt' ]

naming:
  FunctionNaming:
    # kuery-client-spring-data-testing holds shared contract tests in its main source set.
    excludes: [ '**/src/test/**', '**/src/functionalTest/**', '**/kuery-client-spring-data-testing/**' ]

performance:
  SpreadOperator:
    active: false

style:
  ForbiddenComment:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: false # use ktlint
  ReturnCount:
    max: 4

